<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio tags</title>
</head>
<body>
    <h1>Tags em html</h1>
    <p>Em html5 podemos inserir os elementos da lista a seguir. Passe o mouse sobre os termos para descobrir qual tag deverá utilizar em cada caso.</p>
    <ul type="square">
        <li><abbr title="usando a tag &lt p &gt">Parágrafo</abbr></li>
        <li><abbr title="usando as tags &lt h1, h2, h3, h4, h5 e h6 &gt">Títulos</abbr></li>
        <li><abbr title="usando a tag &lt img &gt">Imagens</abbr></li>
        <li><abbr title="usando a tag &lt abbr &gt">Abreviações</abbr></li>
        <li><abbr title="usando a tag &lt code &gt">Códigos-fonte</abbr></li>
        <li><abbr title="usando a tag &lt ol &gt e &lt li &gt">Listas numeradas</abbr></li>
        <li><abbr title="usando as tags &lt dl &gt &lt dt &gt &lt dd &gt">Listas de dermacação</abbr></li>
    </ul>
</body>
</html>
