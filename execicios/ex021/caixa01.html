<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixa</title>
    <style>
        h1 { /* Box-level */
            background-color: lightgray;
            height: 300px;
            width: 300px;
           
            border: 10px solid darkslategray;
            /*Versão extendida:
            border-width: 10px;
            border-style: solid;
            border-color: darkslategray;*/

            padding: 10px 10px 10px 10px;
            /*Versão extendida (sentido horário):
            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;*/

            margin: 20px 20px 40px 20px;
            /*Versão extendida (sentido horário):
            margin-top: 20px;
            margin-right: 20px;
            margin-bottom: 40px;
            margin-left: 20px;*/

            outline: 5px dashed saddlebrown;
            /*Versão extendida:
             outline-width: 5px;
            outline-style: dashed;
            outline-color: saddlebrown;*/
        }

        a { /* inline-level */
            border-width: 10px;
            border-style: solid;
            border-color: rgb(255, 190, 69);
        }
    </style>
</head>
<body>
    <h1>Exemplo de Caixa box-level</h1>
    <p>Parágrafos também são exemplos de box-level, mas os <a href="#"> são exemplos de caixas inline-level.</a> Vamos ver como tudo isso funciona.</p>
</body>
</html>
