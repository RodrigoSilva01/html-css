<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        /*
        # = id
        . = class
        : = pseudo-class
        :: = pseudo-element
        > = children
        */
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: rgb(31, 158, 31);
            text-decoration: none;
            font-weight: bold;
        }

        a:visited {
            color: rgb(18, 68, 18);
        }

        a:hover {
            text-decoration: underline;
            color: lime;
        }

        a:active {
            color: rgb(234, 255, 0);
        }

        a::after {
            content: ' [link]';
            font-weight: 400;
            text-decoration: none;
            color: rgb(31, 158, 31);
        }

        a#principal {
            color: rgb(24, 24, 24);
            content: none;
        }
    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li><a href="https://github.com/gustavoguanabara/html-css" target="_blank">Repositório GitHub</a></li>
        <li><p><a href="https://youtube.com" target="_blank">Canal do YouTube</a></p></li>
        <li><a href="https://www.cursoemvideo.com" target="_blank">Site do Curso</a></li>
    </ul>
    <a id="principal" href="hover.html">Página um</a>
</body>
</html>
