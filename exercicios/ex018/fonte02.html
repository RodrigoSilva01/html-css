<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes externas</title>
    <style>
        @font-face {
            font-family: 'Gotic';
            src: url('fonts/OldLondon.ttf') format('truetype'), url('fonts/Olondon_.otf') format('opentype');
            font-weight: normal;
            font-style: normal;

            /*tipos de format:
              opentype (otf)
              truetype (ttf)
              embedded-opentype
              truetype-att (Apple advanced typografhy)
              svg
            */
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        h1 {
            font-family: 'Gotic', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
        p {
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Incidunt aut quam odio iste aspernatur illo commodi quae suscipit, dignissimos laborum alias eveniet blanditiis, sunt accusantium veniam optio excepturi sint ad!</p>
</body>
</html>
