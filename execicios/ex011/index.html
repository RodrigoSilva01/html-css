<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mídias em HTML5</title>
</head>
<body>
    <h1>imagem dinâmica.</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegador.</p>

    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="imagem flexível">
    </picture>

    <h1>Reproduzindo áudio.</h1>
    <p>Vamos aprender a reprozir áudio em HTML5.</p>
    <audio src="midia/retro dreamscape.mp3" controls></audio>
    <!--MP3, WAV, OGG--> <br>
    <audio preload="metadata" controls loop>
        <source src="midia/guanacast-33.mp3" type="audio/mpeg">
        <source src="midia/guanacast-33.ogg" type="audio/ogg">
        <source src="midia/guanacast-33.wav" type="audio/wav">
        <p>Infelismente seu navegador não consegue reproduzir áudios. <a href="midia/guanacast-33.mp3" download="guanacast-33.mp3" type="audio/mpeg">para baixar clique aqui.</a></p>
    </audio> <br>
    <a href="2.html" rel="next">segunda página</a>
    <h1>Reproduzindo vídeo.</h1>
    <p>Vamos aprender a reproduzir vídeos em HTML5.</p>
    
</body>
</html>
